[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-archaeology"
version = "0.1.0"
description = "Hobby research code for visualising public terrain and reviewing candidate ancient structures against published records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pytest>=7.4",
]

[project.optional-dependencies]
# Not imported in this slice. Present so a later detection step can opt in.
torch = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
